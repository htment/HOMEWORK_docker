global:
  resolve_timeout: 5m

receivers:
- name: 'default-receiver'
  webhook_configs:
  - url: 'http://localhost:9093/-/receive'  # Это заглушка, можно заменить на реальный webhook

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default-receiver'
